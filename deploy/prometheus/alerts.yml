groups:
  - name: hivemind-api
    rules:
      - alert: HiveMindApiScrapeMissing
        expr: absent(up{job="hivemind-api"}) or up{job="hivemind-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: hivemind
        annotations:
          summary: HiveMind API metrics endpoint is unavailable
          description: Prometheus cannot scrape the HiveMind API metrics endpoint for at least two minutes.

      - alert: HiveMindHighServerErrorRate
        expr: >-
          sum(rate(hivemind_http_requests_total{job="hivemind-api",status_code=~"5.."}[5m]))
          / clamp_min(sum(rate(hivemind_http_requests_total{job="hivemind-api"}[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
          service: hivemind
        annotations:
          summary: HiveMind server error rate is elevated
          description: More than 5% of HiveMind requests returned 5xx responses for ten minutes.

      - alert: HiveMindProposalInternalError
        expr: increase(hivemind_proposal_generation_total{job="hivemind-api",reason_code="INTERNAL_ERROR"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: hivemind
        annotations:
          summary: HiveMind proposal generation encountered an internal error
          description: At least one proposal-generation attempt ended with the safe INTERNAL_ERROR reason code in the last five minutes.
