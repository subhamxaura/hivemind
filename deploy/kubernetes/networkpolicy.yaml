apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hivemind-api-ingress
  namespace: hivemind
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hivemind
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              hivemind.io/allow-api-access: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8000
  egress: []
