name: Bug Report
description: Report an issue or regression in HiveMind
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem in HiveMind!
        Please ensure that no sensitive production credentials or secret tokens are included in your submission.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Describe the steps or provide a sanitized incident YAML to reproduce the issue.
      placeholder: |
        1. Run `hivemind analyze ...`
        2. Provide incident input with ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Logs
      description: Terminal output, error traces, or API responses (with secrets redacted).
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Operating System, Python version, HiveMind version.
      placeholder: |
        - OS: Linux / macOS / Windows
        - Python version: 3.11+
        - HiveMind version: 0.1.0
    validations:
      required: true
  - type: checkboxes
    id: checklists
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have verified that no sensitive credentials, cluster certificates, or private keys are exposed.
          required: true
        - label: I confirmed this issue is reproducible on the latest release.
          required: true
